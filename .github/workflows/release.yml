name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          ver=2.43.0
          arch="$(dpkg --print-architecture)"
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${ver}/nfpm_${ver}_${arch}.deb" -o /tmp/nfpm.deb
          sudo apt-get install -y /tmp/nfpm.deb

      - name: Build .deb
        run: make build
        env:
          # tag ref like v0.1.4; nfpm's semver schema strips the leading "v".
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # publish to the APT repo. the .deb was built into dist/ and attached to the
      # GitHub release above; this action writes packages/linux-candy.json in
      # candy-tools/debian-repo and pushes it, which triggers that repo's publish.
      # needs a cross-repo PAT with Contents: read/write on candy-tools/debian-repo,
      # stored as the DEBIAN_REPO_TOKEN secret.
      - name: Register with debian-repo
        uses: candy-tools/debian-repo/.github/actions/register@main
        with:
          name: linux-candy           # must match the .deb's Package field
          dist-dir: dist              # where `make build` wrote the .deb
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
